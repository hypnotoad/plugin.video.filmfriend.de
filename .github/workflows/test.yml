name: test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  unit_tests:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v6

      - name: set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: compile Python sources
        run: python -m compileall -q plugin.video.filmfriend.macsobeck tests

      - name: run unit tests
        run: python -m unittest discover -s tests -v
